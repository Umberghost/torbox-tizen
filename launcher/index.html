<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>TorBox</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f14;color:#e8eef3;font-family:"Samsung One","Segoe UI",Arial,sans-serif}
  .c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:40px;box-sizing:border-box}
  h1{font-size:56px;margin:0}h1 b{color:#17c964}
  p{font-size:28px;color:#8b9aa8;max-width:1100px;margin:0}
  .err{color:#ff6b6b}
  .sp{width:56px;height:56px;border-radius:50%;border:6px solid #1b242d;border-top-color:#17c964;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="c">
  <h1>Tor<b>Box</b></h1>
  <div class="sp" id="sp"></div>
  <p id="msg">Abriendo…</p>
</div>
<script>
/*
 * Lanzador de TorBox: abre TizenBrew pidiéndole (vía AppControl) que cargue
 * directamente el módulo gh/Umberghost/torbox-tizen. TizenBrew lee
 * appControl.data[0].value[0] = JSON {moduleName, moduleType}.
 * Requisito: el módulo debe estar añadido en TizenBrew (Module Manager).
 */
(function(){
  "use strict";
  var TIZENBREW_ID = "xvvl3S1bvH.TizenBrewStandalone";
  var MODULE = { moduleName: "Umberghost/torbox-tizen", moduleType: "gh" };

  function show(text, isError){
    var m = document.getElementById("msg");
    m.textContent = text;
    m.className = isError ? "err" : "";
    if(isError) document.getElementById("sp").style.display = "none";
  }
  function exit(){
    try{ tizen.application.getCurrentApplication().exit(); }catch(e){}
  }

  document.addEventListener("keydown", function(e){
    if(e.keyCode === 10009 || e.keyCode === 27) exit(); // Atrás
  });

  if(!window.tizen || !tizen.application){
    show("Este lanzador solo funciona en una TV Samsung con TizenBrew.", true);
    return;
  }
  try{
    var data = [new tizen.ApplicationControlData("module", [JSON.stringify(MODULE)])];
    var ctrl = new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/view", null, null, null, data);
    tizen.application.launchAppControl(ctrl, TIZENBREW_ID, function(){
      setTimeout(exit, 1500);
    }, function(err){
      show("No se pudo abrir TizenBrew (" + (err && err.message ? err.message : err) +
           "). Comprueba que TizenBrew está instalado y que TorBox está añadido en su Module Manager.", true);
    });
  }catch(e){
    show("Error al lanzar TizenBrew: " + e.message, true);
  }
})();
</script>
</body>
</html>
