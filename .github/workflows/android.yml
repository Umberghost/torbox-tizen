name: Android TV APK

on:
  push:
    branches: [master]
    paths: ['android-tv/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar debug y release (sin firmar)
        run: gradle --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: torbox-tv-debug-apk
          path: android-tv/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: torbox-tv-release-unsigned-apk
          path: android-tv/app/build/outputs/apk/release/*.apk
