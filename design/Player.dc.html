<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TorBox TV — Reproductor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#19D46B}a:hover{color:#5BE597}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #1E2A36; color: #F2F5F8; font-family: Inter, system-ui, sans-serif">
  <div style="position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%); color: #5F7286; font-size: 24px; border: 1px dashed #3C4C5E; padding: 12px 20px; border-radius: 12px">[Vídeo]</div>

  <div style="position: absolute; top: 48px; right: 64px; display: flex; align-items: center; gap: 14px; background: rgba(10,13,18,.82); border-radius: 16px; padding: 14px 22px">
    <span style="font-size: 22px">Saltar intro</span>
    <span style="background: #F2F5F8; color: #0A0D12; border-radius: 10px; padding: 6px 14px; font-weight: 700; font-size: 20px">OK</span>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: auto 0 0 0; height: 560px; background: linear-gradient(0deg, rgba(5,7,10,.96) 30%, rgba(5,7,10,0))"></div>

  <section style="position: absolute; left: 96px; right: 96px; bottom: 56px; display: flex; flex-direction: column; gap: 26px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div>
        <div style="font-size: 22px; color: #A3AFBC">Lupin · T1·E03</div>
        <h1 style="margin: 6px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 56px">Capítulo 3</h1>
      </div>
      <div style="display: flex; gap: 10px; font-size: 19px; color: #C9D2DB">
        <span style="border: 1px solid #3E4B5B; padding: 5px 12px; border-radius: 8px">1080p · HEVC</span>
        <span style="border: 1px solid #3E4B5B; padding: 5px 12px; border-radius: 8px">Audio: Castellano 5.1</span>
        <span style="border: 1px solid #3E4B5B; padding: 5px 12px; border-radius: 8px">Subt.: no</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 22px">
      <span style="font-size: 22px; font-variant-numeric: tabular-nums; width: 110px">17:52</span>
      <div style="flex: 1; height: 10px; border-radius: 5px; background: rgba(242,245,248,.2); position: relative">
        <div style="width: 38%; height: 10px; border-radius: 5px; background: {{accent}}"></div>
        <div style="position: absolute; left: 6%; width: 3%; top: 0; height: 10px; background: rgba(242,184,75,.75); border-radius: 5px" title="Intro"></div>
        <div style="position: absolute; left: calc(38% - 12px); top: -7px; width: 24px; height: 24px; border-radius: 50%; background: #F2F5F8"></div>
      </div>
      <span style="font-size: 22px; font-variant-numeric: tabular-nums; width: 110px; text-align: right; color: #A3AFBC">-29:10</span>
    </div>

    <div role="toolbar" aria-label="Controles" style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; gap: 14px">
        <button aria-label="Retroceder 10 segundos" style="width: 76px; height: 76px; border: 0; border-radius: 20px; background: rgba(242,245,248,.12); color: #F2F5F8; display: flex; align-items: center; justify-content: center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button aria-label="Pausa" style="width: 92px; height: 76px; border: 0; border-radius: 20px; background: #F2F5F8; color: #0A0D12; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px #05070A, 0 0 0 8px #F2F5F8">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        <button aria-label="Avanzar 10 segundos" style="width: 76px; height: 76px; border: 0; border-radius: 20px; background: rgba(242,245,248,.12); color: #F2F5F8; display: flex; align-items: center; justify-content: center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        </button>
        <button aria-label="Siguiente episodio" style="height: 76px; padding: 0 26px; border: 0; border-radius: 20px; background: rgba(242,245,248,.12); color: #F2F5F8; display: flex; align-items: center; gap: 12px; font: 600 22px Inter, sans-serif">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 4l11 8-11 8z"/><rect x="17" y="4" width="3" height="16" rx="1"/></svg>
          E04
        </button>
      </div>
      <div style="display: flex; gap: 12px">
        <button style="height: 64px; padding: 0 22px; border: 0; border-radius: 18px; background: rgba(242,245,248,.12); color: #F2F5F8; font: 600 21px Inter, sans-serif">Audio</button>
        <button style="height: 64px; padding: 0 22px; border: 0; border-radius: 18px; background: rgba(242,245,248,.12); color: #F2F5F8; font: 600 21px Inter, sans-serif">Subtítulos</button>
        <button style="height: 64px; padding: 0 22px; border: 0; border-radius: 18px; background: rgba(242,245,248,.12); color: #F2F5F8; font: 600 21px Inter, sans-serif">Velocidad 1×</button>
        <button style="height: 64px; padding: 0 22px; border: 0; border-radius: 18px; background: rgba(242,245,248,.12); color: #F2F5F8; font: 600 21px Inter, sans-serif">Imagen</button>
        <button style="height: 64px; padding: 0 22px; border: 0; border-radius: 18px; background: rgba(242,245,248,.12); color: #F2F5F8; font: 600 21px Inter, sans-serif">Apagar en…</button>
        <button aria-label="Información técnica" style="width: 64px; height: 64px; border: 0; border-radius: 18px; background: rgba(242,245,248,.12); color: #F2F5F8; font: 700 24px Inter, sans-serif">i</button>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#19D46B","options":["#19D46B","#4C8DFF","#F2B84B","#E25C8C"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#19D46B' };
  }
}
</script>
</body>
</html>
